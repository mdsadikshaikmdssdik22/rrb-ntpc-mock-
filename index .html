<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRB NTPC Mock Test</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f5f9;
  color:#222;
}
header{
  background:#173b70;
  color:white;
  padding:15px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:10;
}
header h1{margin:0;font-size:22px}
#timer{
  margin-top:8px;
  font-size:20px;
  font-weight:bold;
  color:#ffe066;
}
.container{
  max-width:1000px;
  margin:auto;
  padding:15px;
}
.topbar{
  background:white;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  box-shadow:0 2px 8px #ccc;
}
select{
  padding:10px;
  width:100%;
  font-size:16px;
  border-radius:6px;
}
.card{
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 2px 8px #ccc;
}
.question{
  font-size:19px;
  font-weight:bold;
  margin-bottom:18px;
}
.option{
  display:block;
  padding:12px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:8px;
  cursor:pointer;
}
.option:hover{background:#eef5ff}
.option input{margin-right:10px}
.buttons{
  display:flex;
  gap:8px;
  margin-top:20px;
  flex-wrap:wrap;
}
button{
  border:0;
  border-radius:7px;
  padding:12px 18px;
  font-size:15px;
  cursor:pointer;
}
.prev{background:#777;color:white}
.next{background:#1769aa;color:white}
.submit{background:#16833b;color:white}
.clear{background:#dc3545;color:white}
.palette{
  background:white;
  margin-top:15px;
  padding:15px;
  border-radius:10px;
  box-shadow:0 2px 8px #ccc;
}
.palette-grid{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:6px;
}
.qbtn{
  padding:8px 0;
  border:1px solid #aaa;
  background:#eee;
  border-radius:5px;
}
.qbtn.answered{background:#4caf50;color:white}
.qbtn.current{border:3px solid #173b70}
.result{
  display:none;
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 2px 8px #ccc;
}
.score{
  font-size:28px;
  font-weight:bold;
  color:#173b70;
}
.review-item{
  border-top:1px solid #ddd;
  padding:15px 0;
}
.correct{color:green;font-weight:bold}
.wrong{color:red;font-weight:bold}
@media(max-width:600px){
  .palette-grid{grid-template-columns:repeat(5,1fr)}
  .question{font-size:17px}
}
</style>
</head>

<body>

<header>
  <h1>🚆 RRB NTPC Mock Test</h1>
  <div id="timer">90:00</div>
</header>

<div class="container">

<div class="topbar">
  <label><b>Select Language / भाषा / భాష</b></label>
  <select id="language" onchange="renderQuestion()">
    <option value="en">English</option>
    <option value="te">తెలుగు</option>
    <option value="hi">हिन्दी</option>
  </select>
</div>

<div id="testArea">

<div class="card">
  <div id="questionNumber"></div>
  <div id="questionText" class="question"></div>
  <div id="options"></div>

  <div class="buttons">
    <button class="prev" onclick="previousQuestion()">← Previous</button>
    <button class="next" onclick="nextQuestion()">Next →</button>
    <button class="clear" onclick="clearAnswer()">Clear</button>
    <button class="submit" onclick="confirmSubmit()">Submit Test</button>
  </div>
</div>

<div class="palette">
  <b>Question Palette</b>
  <p>🟩 Answered &nbsp; ⚪ Not Answered</p>
  <div id="palette" class="palette-grid"></div>
</div>

</div>

<div id="result" class="result"></div>

</div>

let current = 0;
let answers = new Array(questions.length).fill(null);
let timeLeft = 90 * 60;
let submitted = false;

function renderQuestion(){

  if(submitted) return;

  const lang = document.getElementById("language").value;
  const q = questions[current];

  document.getElementById("questionNumber").innerHTML =
    "<b>Question " + (current+1) + " / " + questions.length + "</b>";

  document.getElementById("questionText").textContent =
    q.q[lang];

  let html = "";

  q.o[lang].forEach((option,index)=>{

    const checked = answers[current] === index ? "checked" : "";

    html += `
      <label class="option">
        <input type="radio"
               name="answer"
               value="${index}"
               ${checked}
               onchange="selectAnswer(${index})">
        ${String.fromCharCode(65+index)}. ${option}
      </label>
    `;
  });

  document.getElementById("options").innerHTML = html;

  updatePalette();
}

function selectAnswer(index){
  answers[current] = index;
  updatePalette();
}

function clearAnswer(){
  answers[current] = null;
  renderQuestion();
}

function nextQuestion(){
  if(current < questions.length-1){
    current++;
    renderQuestion();
  }
}

function previousQuestion(){
  if(current > 0){
    current--;
    renderQuestion();
  }
}

function goToQuestion(index){
  current = index;
  renderQuestion();
}

function updatePalette(){

  let html="";

  for(let i=0;i<questions.length;i++){

    let cls="qbtn";

    if(answers[i] !== null)
      cls += " answered";

    if(i===current)
      cls += " current";

    html += `
      <button class="${cls}"
              onclick="goToQuestion(${i})">
        ${i+1}
      </button>
    `;
  }

  document.getElementById("palette").innerHTML=html;
}

function updateTimer(){

  if(submitted) return;

  let minutes = Math.floor(timeLeft/60);
  let seconds = timeLeft%60;

  document.getElementById("timer").textContent =
    String(minutes).padStart(2,"0") + ":" +
    String(seconds).padStart(2,"0");

  if(timeLeft <= 0){
    submitTest();
    return;
  }

  timeLeft--;
}

setInterval(updateTimer,1000);

function confirmSubmit(){

  let unanswered =
    answers.filter(x=>x===null).length;

  if(confirm(
    "Submit test?\n\n" +
    "Answered: " + (questions.length-unanswered) +
    "\nUnanswered: " + unanswered
  )){
    submitTest();
  }
}

function submitTest(){

  if(submitted) return;

  submitted=true;

  let correct=0;
  let wrong=0;
  let unanswered=0;

  questions.forEach((q,i)=>{

    if(answers[i]===null){
      unanswered++;
    }
    else if(answers[i]===q.a){
      correct++;
    }
    else{
      wrong++;
    }

  });

  const score =
    correct - (wrong/3);

  const percentage =
    (score / questions.length) * 100;

  let grade;

  if(percentage>=90) grade="A+";
  else if(percentage>=80) grade="A";
  else if(percentage>=70) grade="B";
  else if(percentage>=60) grade="C";
  else if(percentage>=50) grade="D";
  else grade="F";

  let resultText = "";

  if(percentage >= 40)
    resultText = "PASS";
  else
    resultText = "FAIL";

  document.getElementById("testArea").style.display="none";

  const result =
    document.getElementById("result");

  result.style.display="block";

  result.innerHTML = `
    <h2>🎯 Test Result</h2>

    <div class="score">
      Score: ${score.toFixed(2)} / ${questions.length}
    </div>

    <p><b>Correct:</b> ${correct}</p>
    <p><b>Wrong:</b> ${wrong}</p>
    <p><b>Unanswered:</b> ${unanswered}</p>

    <p><b>Percentage:</b>
       ${percentage.toFixed(2)}%</p>

    <p><b>Grade:</b> ${grade}</p>

    <p><b>Result:</b>
       <span class="${resultText==="PASS"?"correct":"wrong"}">
       ${resultText}
       </span>
    </p>

    <hr>

    <h2>📖 Answer Review</h2>

    <div id="review"></div>

    <button class="next"
            onclick="location.reload()">
      🔄 Restart Test
    </button>
  `;

  showReview();
}

function showReview(){

  const lang =
    document.getElementById("language").value;

  let html="";

  questions.forEach((q,i)=>{

    const userAnswer = answers[i];

    html += `
      <div class="review-item">

        <b>Q${i+1}. ${q.q[lang]}</b>
        <br><br>

        Your Answer:
        ${
          userAnswer===null
          ? "<span class='wrong'>Not Answered</span>"
          : q.o[lang][userAnswer]
        }

        <br>

        Correct Answer:
        <span class="correct">
          ${q.o[lang][q.a]}
        </span>

      </div>
    `;

  });

  document.getElementById("review").innerHTML=html;
}

renderQuestion();

</script>
